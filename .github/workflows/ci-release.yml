name: CI and Release

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
  push:
    branches: [main]
    paths:
      - 'shell/**'
      - '.github/workflows/ci-release.yml'

permissions:
  contents: read

jobs:
  validate:
    name: Core validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0

      - name: Install ShellCheck
        run: |
          sudo apt-get update
          sudo apt-get install --yes shellcheck

      - name: Build and test
        run: |
          bash shell/build.sh
          shellcheck -S warning shell/sm.sh shell/build.sh shell/tests/regression.sh
          bash shell/tests/regression.sh

      - name: Validate version
        shell: bash
        run: |
          set -euo pipefail
          source shell/src/lib/version.sh
          version=$(sed -n 's/^SCRIPT_VERSION="\([^"]*\)"$/\1/p' shell/src/config.sh)
          version::is_valid "$version" || {
            echo "Invalid SCRIPT_VERSION: $version" >&2
            exit 1
          }

          if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]] &&
             ! git diff --quiet "origin/$GITHUB_BASE_REF...HEAD" -- shell; then
            base_version=$(git show "origin/$GITHUB_BASE_REF:shell/src/config.sh" |
              sed -n 's/^SCRIPT_VERSION="\([^"]*\)"$/\1/p')
            version::ge "$version" "$base_version" || {
              echo "SCRIPT_VERSION must not decrease from $base_version (current: $version)." >&2
              exit 1
            }
          fi

  compatibility:
    name: Compatibility (${{ matrix.image }})
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image:
          - debian:12-slim
          - ubuntu:24.04
    container: ${{ matrix.image }}
    steps:
      - name: Install test runtime
        run: |
          apt-get update
          apt-get install --yes bash ca-certificates coreutils gawk git grep sed util-linux

      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Build and test
        run: |
          bash shell/build.sh --check
          bash shell/tests/regression.sh

  main-gate:
    name: Main branch gate
    if: ${{ always() && github.event_name == 'pull_request' }}
    needs: [validate, compatibility]
    runs-on: ubuntu-latest
    steps:
      - name: Verify required jobs
        env:
          VALIDATE_RESULT: ${{ needs.validate.result }}
          COMPATIBILITY_RESULT: ${{ needs.compatibility.result }}
        run: |
          [[ "$VALIDATE_RESULT" == "success" ]]
          [[ "$COMPATIBILITY_RESULT" == "success" ]]

  release:
    name: Publish release
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout merged history
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0

      - name: Build release artifact
        run: bash shell/build.sh

      - name: Decide whether to publish
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          source shell/src/lib/version.sh
          version=$(sed -n 's/^SCRIPT_VERSION="\([^"]*\)"$/\1/p' shell/src/config.sh)
          version::is_valid "$version" || {
            echo "Invalid SCRIPT_VERSION: $version" >&2
            exit 1
          }
          tag="v$version"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "Release $tag already exists; skipping publication."
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Prepare release files
        if: steps.release.outputs.publish == 'true'
        shell: bash
        run: |
          set -euo pipefail
          version=$(sed -n 's/^SCRIPT_VERSION="\([^"]*\)"$/\1/p' shell/src/config.sh)
          tag="v$version"

          mkdir -p dist
          cp shell/sm.sh dist/sm.sh
          chmod 0755 dist/sm.sh
          (cd dist && sha256sum sm.sh > sm.sh.sha256)

          previous_tag=$(git tag --sort=-version:refname | sed -n '1p' || true)
          if [[ -n "$previous_tag" ]]; then
            changes=$(git log "$previous_tag..HEAD" --no-merges --pretty=format:'- %s' | sed -n '1,8p')
          else
            changes=$(git log HEAD --no-merges --pretty=format:'- %s' | sed -n '1,8p')
          fi
          {
            echo "## $tag"
            echo
            if [[ -n "$changes" ]]; then
              printf '%s\n' "$changes"
            else
              echo '- Maintenance update.'
            fi
          } > release-notes.md

      - name: Create GitHub release
        if: steps.release.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          source shell/src/lib/version.sh
          version=$(sed -n 's/^SCRIPT_VERSION="\([^"]*\)"$/\1/p' shell/src/config.sh)
          args=("v$version" dist/sm.sh dist/sm.sh.sha256
            --title "v$version"
            --notes-file release-notes.md)
          if version::is_prerelease "$version"; then
            args+=(--prerelease)
          fi
          gh release create "${args[@]}"
